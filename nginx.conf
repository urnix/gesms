server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/xml;

    # Revalidate everything: files are small, and the service worker caches them for offline use anyway
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # nginx's mime.types does not know .webmanifest
    location ~* \.webmanifest$ {
        types { }
        default_type application/manifest+json;
    }
}
