<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#E4002B"/>
  <circle cx="256" cy="256" r="196" fill="#fff"/>
  <svg x="106" y="100" width="300" height="300" viewBox="0 0 120 120">
  <g stroke="#2a2a2a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- ears -->
    <path d="M20 48 L25 12 L50 32 Z" fill="#fff"/>
    <path d="M100 48 L95 12 L70 32 Z" fill="#fff"/>
    <path d="M27 38 L29 22 L41 32 Z" fill="#E4002B" stroke="none"/>
    <path d="M93 38 L91 22 L79 32 Z" fill="#E4002B" stroke="none"/>

    <!-- head -->
    <ellipse cx="60" cy="60" rx="45" ry="38" fill="#fff"/>

    <!-- eyes -->
    <circle cx="41" cy="56" r="8.5" fill="#2a2a2a" stroke="none"/>
    <circle cx="79" cy="56" r="8.5" fill="#2a2a2a" stroke="none"/>
    <circle cx="44" cy="52.5" r="3.2" fill="#fff" stroke="none"/>
    <circle cx="82" cy="52.5" r="3.2" fill="#fff" stroke="none"/>
    <circle cx="38.5" cy="59.5" r="1.4" fill="#fff" stroke="none"/>
    <circle cx="76.5" cy="59.5" r="1.4" fill="#fff" stroke="none"/>

    <!-- cheeks -->
    <ellipse cx="28" cy="69" rx="7" ry="4.2" fill="#E4002B" opacity=".28" stroke="none"/>
    <ellipse cx="92" cy="69" rx="7" ry="4.2" fill="#E4002B" opacity=".28" stroke="none"/>

    <!-- nose, ω mouth and tongue -->
    <path d="M56.5 63 h7 l-3.5 4 Z" fill="#E4002B" stroke-width="2"/>
    <ellipse cx="63.5" cy="75" rx="3" ry="3.8" fill="#ff8fa0" stroke-width="2"/>
    <path d="M52 69 Q56 75 60 69 Q64 75 68 69" fill="none" stroke-width="2.5"/>

    <!-- whiskers -->
    <path d="M18 62 L6 59 M18 68 L6 70 M102 62 L114 59 M102 68 L114 70" stroke-width="2"/>

    <!-- phone with a message -->
    <rect x="43" y="80" width="34" height="34" rx="6" fill="#E4002B"/>
    <rect x="48" y="86" width="24" height="13" rx="5" fill="#fff" stroke="none"/>
    <path d="M52 99 l-2 4 l6 -4 Z" fill="#fff" stroke="none"/>
    <circle cx="54" cy="92.5" r="1.6" fill="#E4002B" stroke="none"/>
    <circle cx="60" cy="92.5" r="1.6" fill="#E4002B" stroke="none"/>
    <circle cx="66" cy="92.5" r="1.6" fill="#E4002B" stroke="none"/>

    <!-- paws holding the phone -->
    <ellipse cx="42" cy="100" rx="8.5" ry="7.5" fill="#fff"/>
    <ellipse cx="78" cy="100" rx="8.5" ry="7.5" fill="#fff"/>
    <path d="M39 97 v4 M44 97 v4 M76 97 v4 M81 97 v4" stroke-width="1.8"/>
  </g>
</svg>
</svg>
